<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>돼지공주나라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root { --ink:#191F28; --sub:#6B7684; --blue:#3182F6; --blue-d:#1B64DA; --blue-s:#E8F3FF; --bg:#F2F4F6; --line:#E5E8EB; --red:#F04452; --green:#00B26B; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button { font-family: inherit; }

/* ---------- 로그인 ---------- */
.login { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; }
.login .logo { width: 56px; height: 56px; font-size: 26px; border-radius: 18px; }
.login h1 { margin: 0; font-size: 26px; font-weight: 800; }
.login p { margin: -6px 0 4px; color: var(--sub); font-size: 15px; }
.lbox { width: 100%; max-width: 340px; background: #fff; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(25,31,40,.08); }
.lbox input { width: 100%; height: 52px; border: 1.5px solid var(--line); border-radius: 14px; padding: 0 16px; font-size: 17px; font-family: inherit; background: #F9FAFB; }
.lbox input:focus { outline: 3px solid var(--blue); outline-offset: 1px; background: #fff; }
.linkbtn { background: none; border: 0; color: var(--sub); font-size: 14px; cursor: pointer; padding: 8px; min-height: 44px; }
.gwrap { display: flex; flex-direction: column; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.err { color: var(--red); font-size: 14px; font-weight: 500; min-height: 18px; margin: 0; text-align: center; }

/* ---------- 바깥 틀 ---------- */
.stage { min-height: 100vh; padding: 0 16px 48px; }
.top { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 22px 0 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
.logo { width: 34px; height: 34px; border-radius: 11px; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; }
.top-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { font-size: 13px; font-weight: 700; color: var(--blue-d); background: var(--blue-s); border-radius: 999px; padding: 6px 12px; }
.chip.gray { color: #4E5968; background: var(--line); font-weight: 500; }
.ghost { font-family: inherit; font-size: 14px; font-weight: 500; color: #4E5968; background: #fff; border: 0; border-radius: 12px; padding: 0 14px; height: 44px; min-width: 44px; cursor: pointer; }
.asel { height: 44px; border: 0; border-radius: 12px; background: #fff; padding: 0 12px; font-family: inherit; font-size: 14px; color: #4E5968; max-width: 200px; }

/* ---------- 서류철 + 포스트잇 탭 ---------- */
.wrap { max-width: 1120px; margin: 0 auto; display: flex; align-items: flex-start; }
.tabs { display: flex; flex-direction: column; gap: 14px; padding-top: 44px; margin-right: -18px; position: relative; flex: 0 0 auto; }
.tab { position: relative; z-index: 20; width: 124px; height: 58px; border: 0; cursor: pointer; text-align: left; padding: 0 12px 0 18px; font-size: 15px; font-weight: 700; color: var(--ink); letter-spacing: -0.2px; border-radius: 4px 12px 12px 4px; box-shadow: 0 1px 1px rgba(25,31,40,.10), 0 6px 14px rgba(25,31,40,.10); transition: transform .2s ease, box-shadow .2s ease; background-image: linear-gradient(to right, rgba(25,31,40,.10), rgba(25,31,40,0) 14px); }
.tab::after { content: ''; position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; border-radius: 12px 0 4px 0; background: linear-gradient(135deg, rgba(255,255,255,0) 50%, rgba(25,31,40,.10) 50%); }
.tab[data-id=etc] { border: 1px solid #E5E8EB; }
.tab:nth-child(odd) { transform: rotate(-1.4deg); }
.tab:nth-child(even) { transform: rotate(1.1deg); }
.tab:hover { transform: translateX(-3px) rotate(0deg); }
.tab.on:hover { transform: translateX(16px) rotate(0deg); }
.tab.on { z-index: 40; transform: translateX(16px) rotate(0deg); box-shadow: 0 1px 1px rgba(25,31,40,.12), 0 10px 22px rgba(25,31,40,.18); }
.tab:focus-visible, .btn:focus-visible, .ghost:focus-visible, .chipbtn:focus-visible, .tm:focus-visible, .seg:focus-visible, .field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.folder { flex: 1 1 0; min-width: 0; position: relative; background: var(--line); border-radius: 28px; box-shadow: 0 1px 0 rgba(25,31,40,.04), 0 18px 40px rgba(25,31,40,.10); overflow: hidden; }
.folder::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 38px; z-index: 30; background: linear-gradient(to right, #CDD2D8, #DADEE3 70%, #E5E8EB); pointer-events: none; }
.stack { position: relative; display: grid; margin-left: 38px; min-height: 780px; perspective: 2200px; perspective-origin: 0% 40%; }
.leaf { grid-area: 1 / 1; position: relative; background: #fff; border-radius: 0 28px 28px 0; padding: 40px 44px 48px 40px; transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden; visibility: hidden; pointer-events: none; transition: transform .85s cubic-bezier(.45,.05,.2,1), opacity .2s linear 0s, visibility 0s linear .85s; min-width: 0; }
.leaf::after { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(to left, rgba(25,31,40,0) 30%, rgba(25,31,40,.28)); opacity: 0; transition: opacity .6s ease; pointer-events: none; }
.leaf.cur { visibility: visible; pointer-events: auto; transition: transform .85s cubic-bezier(.45,.05,.2,1), opacity .2s linear 0s, visibility 0s linear 0s; }
.leaf.gone { transform: rotateY(-112deg); opacity: 0; transition: transform .85s cubic-bezier(.45,.05,.2,1), opacity .3s linear .5s, visibility 0s linear .85s; }
.leaf.gone::after { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .leaf, .leaf.cur, .leaf.gone, .tab { transition: none !important; } }

/* ---------- 화면 안쪽 ---------- */
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.eyebrow { margin: 0 0 6px; font-size: 14px; font-weight: 500; color: var(--sub); }
h1 { margin: 0; font-size: 28px; line-height: 1.35; font-weight: 800; letter-spacing: -0.6px; }
h2 { margin: 0 0 14px; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
h3 { margin: 0 0 10px; font-size: 16px; font-weight: 700; }
.tm { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 12px; border: 0; cursor: pointer; font-size: 14px; font-weight: 700; background: var(--bg); color: #4E5968; }
.tm.on { background: var(--ink); color: #fff; }
.hero { background: #F9FAFB; border-radius: 22px; padding: 26px 28px 24px; }
.hero small { font-size: 14px; color: var(--sub); font-weight: 500; }
.big { margin: 6px 0 18px; font-size: 44px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.15; }
.big span { font-size: 22px; font-weight: 700; margin-left: 4px; color: #4E5968; }
.big.debt { color: var(--red); }
.notice { background: #FFF0F1; color: #C9303C; border-radius: 14px; padding: 12px 16px; font-size: 14px; margin-bottom: 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: #fff; border-radius: 16px; padding: 14px 16px; border: 0; text-align: left; font-family: inherit; color: inherit; }
button.stat { cursor: pointer; }
.stat small { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
.stat b { font-size: 20px; font-weight: 800; letter-spacing: -0.4px; }
.stat i { display: block; font-style: normal; font-size: 12px; color: var(--sub); margin-top: 2px; }
.row-btn { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { height: 52px; padding: 0 22px; border-radius: 14px; border: 0; font-size: 16px; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; min-width: 44px; }
.btn.sec { background: var(--blue-s); color: var(--blue-d); }
.btn.gray { background: var(--bg); color: #4E5968; }
.btn.red { background: var(--red); }
.btn.small { height: 44px; font-size: 14px; padding: 0 16px; border-radius: 12px; }
.btn.tiny { height: 36px; font-size: 13px; padding: 0 12px; border-radius: 10px; }
.btn:disabled { background: #D1D6DB; color: #8B95A1; cursor: default; }
.list { margin-top: 28px; }
.item { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
.ic { width: 44px; height: 44px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; flex: 0 0 44px; }
.ic.in { background: var(--blue-s); color: var(--blue-d); }
.ic.out { background: #FFEEEE; color: #D22030; }
.item .t { flex: 1 1 auto; min-width: 0; }
.item .t b { display: block; font-size: 16px; font-weight: 600; }
.item .t span { font-size: 13px; color: var(--sub); }
.amt { font-size: 16px; font-weight: 700; white-space: nowrap; }
.amt.p { color: var(--blue-d); } .amt.m { color: var(--ink); }
.segs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.seg { height: 44px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--bg); color: #4E5968; font-size: 15px; font-weight: 700; cursor: pointer; }
.seg.on { background: var(--ink); color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.card { background: #F9FAFB; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.card .nm { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.card .ds { font-size: 13px; color: var(--sub); min-height: 36px; }
.card .pr { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-top: 4px; }
.card .st { font-size: 13px; color: var(--sub); }
.badge { align-self: flex-start; font-size: 12px; font-weight: 700; color: var(--blue-d); background: var(--blue-s); border-radius: 6px; padding: 3px 8px; }
.badge.gray { color: #4E5968; background: var(--line); }
.badge.green { color: #00794A; background: #E6F7F0; }
.badge.warn { color: #C9303C; background: #FFF0F1; }
.empty { background: #F9FAFB; border-radius: 20px; padding: 40px 20px; text-align: center; color: var(--sub); }
.note { font-size: 13px; color: var(--sub); margin: 0 0 14px; line-height: 1.6; }
.bar { background: var(--bg); border-radius: 999px; height: 14px; overflow: hidden; margin: 8px 0; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #3182F6, #1B64DA); border-radius: 999px; }

/* ---------- 우리반 보드 ---------- */
.post { background: #F9FAFB; border-radius: 20px; padding: 18px; margin-bottom: 14px; }
.post .who { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; }
.post .who b { font-size: 15px; }
.post .who span { font-size: 12px; color: var(--sub); }
.post .txt { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.6; margin: 0 0 10px; }
.post .lnk { display: block; font-size: 14px; color: var(--blue-d); word-break: break-all; margin-bottom: 10px; }
.lbx { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; touch-action: pan-y; }
.lbx img { max-width: 100vw; max-height: 100vh; object-fit: contain; display: block; user-select: none; -webkit-user-drag: none; }
.lbx button { position: absolute; border: 0; cursor: pointer; color: #fff; background: rgba(255,255,255,.18); border-radius: 50%; width: 52px; height: 52px; font-size: 24px; line-height: 1; display: flex; align-items: center; justify-content: center; }
.lbx button:hover, .lbx button:focus-visible { background: rgba(255,255,255,.34); }
.lbx .lprev { left: 14px; top: 50%; transform: translateY(-50%); }
.lbx .lnext { right: 14px; top: 50%; transform: translateY(-50%); }
.lbx .lclose { right: 14px; top: 14px; width: 44px; height: 44px; font-size: 20px; }
.lbx .lcount { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); color: #fff; background: rgba(0,0,0,.5); border-radius: 999px; padding: 4px 14px; font-size: 14px; }
.pfiles { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 10px; }
.pfile { display: flex; align-items: center; gap: 8px; background: var(--bg, #F2F4F6); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
.pfile a { color: inherit; text-decoration: none; }
.pfile .fn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.pfile .fn:hover { text-decoration: underline; }
.pfile small { color: var(--sub); white-space: nowrap; }
.pfile .fdl { font-size: 13px; color: var(--blue, #3182F6); font-weight: 600; white-space: nowrap; }
.flist { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 12px; }
.flist .pfile button { border: 0; background: var(--ink); color: #fff; width: 24px; height: 24px; border-radius: 50%; cursor: pointer; font-size: 13px; line-height: 1; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; margin-bottom: 10px; }
.pgrid.one { grid-template-columns: minmax(0, 360px); }
.pgrid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; cursor: zoom-in; background: var(--line); display: block; }
.pgrid.one img { aspect-ratio: auto; max-height: 360px; object-fit: contain; background: transparent; }
.post .bar2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.like { height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 14px; font-weight: 700; color: #4E5968; cursor: pointer; }
.like.on { background: var(--blue-s); border-color: var(--blue); color: var(--blue-d); }
.cmt { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
.cmt b { margin-right: 6px; }
.cmt small { color: var(--sub); margin-left: 6px; }
.cmtform { display: flex; gap: 8px; margin-top: 8px; }
.cmtform input { flex: 1; min-width: 0; height: 44px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; font-family: inherit; font-size: 15px; background: #fff; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.thumbs div { position: relative; }
.thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; display: block; }
.thumbs button { position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; cursor: pointer; font-size: 14px; line-height: 1; }
.bcard { text-align: left; border: 0; cursor: pointer; font-family: inherit; color: inherit; }

/* ---------- 교사 모드 덮기 · 직업 활동 · 자리 ---------- */
.leaf.tmon > .stud { display: none; }
.subgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.subc { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: #fff; }
.subc.ok { border-color: #00B26B; background: #E9F9F1; } .subc.no { border-color: var(--red); background: #FFF0F1; }
.subc b { display: block; margin-bottom: 8px; font-size: 15px; }
.subc .ox { display: flex; gap: 6px; }
.subc .ox button { flex: 1; border: 0; border-radius: 10px; padding: 10px 4px; font-weight: 700; font-size: 13px; cursor: pointer; background: #F2F4F6; color: var(--sub); font-family: inherit; }
.subc .ox .o.on { background: #00B26B; color: #fff; } .subc .ox .x.on { background: var(--red); color: #fff; }
.leaf.out { position: absolute; top: 0; left: 0; right: 0; }
.tool { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 22px; }
.tasks { margin: 6px 0 0; padding-left: 20px; line-height: 1.9; font-size: 15px; }
.chipbtn.bad { background: #FFF0F1; border-color: var(--red); color: var(--red); font-weight: 700; }
.bank-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.bank-ds { min-height: 4.8em; line-height: 1.6; }
.blackboard { background: #3C5A4A; color: #fff; text-align: center; border-radius: 10px; padding: 6px; font-size: 13px; margin-bottom: 10px; letter-spacing: 6px; }
.sgrid { overflow-x: auto; padding-bottom: 4px; }
.srow { display: flex; gap: 8px; margin-bottom: 8px; }
.aisle { flex: 0 0 18px; }
.seat { flex: 1 1 0; min-width: 78px; border: 1.5px solid var(--line); background: #F9FAFB; border-radius: 12px; padding: 8px 6px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 2px; align-items: center; color: var(--ink); }
.seat.none { border: 0; background: transparent; cursor: default; }
.seat small { color: var(--sub); font-size: 11px; }
.seat b { font-size: 14px; }
.seat i { font-style: normal; font-size: 11px; color: var(--sub); }
.seat.taken { background: var(--blue-s); border-color: var(--blue); }
.seat.paid { background: #E6F7F0; border-color: #4CC9A0; }
.seat.pend { outline: 2px dashed #F5B400; }
/* ---------- 우리반 보드 (padlet) ---------- */
.bhead { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.plus { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; font-size: 34px; line-height: 1; cursor: pointer; box-shadow: 0 6px 16px rgba(49,130,246,.35); flex: 0 0 auto; }
.plus:hover { background: var(--blue-d); }
.bfull { position: fixed; inset: 0; z-index: 90; background: #FFF3B8; overflow-y: auto; padding: 20px clamp(16px, 4vw, 48px) 60px; }
.bfull .bhead { position: sticky; top: 0; z-index: 2; margin: -20px calc(-1 * clamp(16px, 4vw, 48px)) 18px; padding: 16px clamp(16px, 4vw, 48px); background: #FFF3B8; border-bottom: 1px solid rgba(0,0,0,.06); }
.bfull .bclose { margin-left: auto; }
.bfull .post.dragover { outline: 3px dashed var(--blue); }
.bfull .post[draggable=true] { cursor: grab; }
.bfull .post.dragging { opacity: .4; }
.bfull .pad { columns: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 22px 20px; padding: 6px 0 0; align-items: start; }
.bfull .pad .post { display: flex; flex-direction: column; width: auto; margin: 0; min-height: 290px; border: 0; border-radius: 14px; box-shadow: 0 2px 6px rgba(0,0,0,.08); cursor: pointer; transition: transform .15s, box-shadow .15s; }
.bfull .pad .post:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0,0,0,.12); }
.bfull .pad .pbody { flex: 1; padding: 12px 14px; }
.cph { position: relative; height: 110px; border-radius: 8px; margin-bottom: 10px; background: var(--line) center / cover no-repeat; }
.cph .more { position: absolute; right: 6px; bottom: 6px; background: rgba(25,31,40,.7); color: #fff; font-size: 11px; border-radius: 999px; padding: 2px 8px; }
@media (max-width: 640px) { .bfull .pad { grid-template-columns: repeat(2, 1fr); gap: 14px 12px; } .bfull .pad .post { min-height: 250px; } .cph { height: 90px; } }
.bfull .post .who b { font-size: 14px; } .bfull .post .who span { font-size: 11px; }
.bfull .post .txt.clamp { font-size: 13.5px; margin: 0; display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
.cfoot { display: flex; gap: 12px; padding: 8px 14px 12px; font-size: 12px; color: var(--sub); border-top: 1px solid var(--line); }
.bfull .mv { opacity: 0; transition: opacity .15s; position: absolute; top: 6px; left: 6px; right: 6px; padding: 0; z-index: 2; justify-content: space-between; }
.bfull .post { position: relative; }
.bfull .post:hover .mv, .bfull .post:focus-within .mv { opacity: 1; }
@media (hover: none) { .bfull .mv { opacity: 1; } }
.bfull .mv .btn { box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.bfull .mv { display: flex; gap: 6px; padding: 8px 12px 0; align-items: center; font-size: 12px; color: var(--sub); }
.pad { columns: 3 230px; column-gap: 14px; }
.pad .post { break-inside: avoid; display: inline-block; width: 100%; padding: 0; overflow: hidden; background: #fff; border: 1.5px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,.04); }
.pad .pbody { padding: 14px 16px 16px; }
.pbig { width: 100%; display: block; cursor: zoom-in; background: var(--line); }
.pad .pgrid { padding: 8px 8px 0; margin-bottom: 0; grid-template-columns: repeat(3, 1fr); }
.pad .pgrid img { aspect-ratio: 1; }

/* ---------- 교사 모드 ---------- */
.tpanel { margin-top: 30px; border: 2px dashed #B0B8C1; border-radius: 22px; padding: 24px; background: #fff; }
.tpanel .lbl { display: inline-block; font-size: 12px; font-weight: 700; color: #fff; background: var(--ink); border-radius: 6px; padding: 3px 8px; margin-bottom: 12px; }
.form { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1 1 160px; }
.field label { font-size: 13px; font-weight: 500; color: #4E5968; }
.field input, .field textarea, .field select { font-family: inherit; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; background: #F9FAFB; color: var(--ink); height: 48px; width: 100%; }
.field textarea { height: 120px; padding: 12px 14px; resize: vertical; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chipbtn { height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 14px; font-weight: 500; color: #4E5968; cursor: pointer; }
.chipbtn.sel { background: var(--blue-s); border-color: var(--blue); color: var(--blue-d); font-weight: 700; }
.mrow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--bg); flex-wrap: wrap; }
.mrow .t { flex: 1 1 200px; min-width: 0; font-size: 15px; font-weight: 500; }
.mrow .t i { font-style: normal; font-size: 13px; color: var(--sub); display: block; margin-top: 2px; }
.mrow .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.tscroll { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 12px; color: var(--sub); font-weight: 500; padding: 8px 8px; white-space: nowrap; }
.tbl td { padding: 8px; border-top: 1px solid var(--bg); white-space: nowrap; vertical-align: middle; }
.tbl td.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .neg { color: var(--red); font-weight: 700; }
.mini { height: 38px; width: 72px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 8px; font-family: inherit; font-size: 14px; background: #F9FAFB; }
.mini.seat { width: 76px; }
.sel-s { height: 38px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 6px; font-family: inherit; font-size: 13px; background: #F9FAFB; max-width: 150px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: 14px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-bottom: 18px; }
.cbox { background: #F9FAFB; border-radius: 16px; padding: 16px; }
.mbar { display: flex; align-items: flex-end; gap: 10px; height: 90px; margin: 8px 0 4px; }
.mbar div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; color: var(--sub); }
.mbar i { display: block; width: 100%; max-width: 38px; background: var(--blue); border-radius: 6px 6px 0 0; min-height: 2px; }

/* ---------- 창 · 알림 ---------- */
.modal { position: fixed; inset: 0; background: rgba(25,31,40,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
.sheet { background: #fff; border-radius: 24px; padding: 26px; width: 100%; max-width: 380px; max-height: 90vh; overflow: auto; }
.sheet.wide { max-width: 560px; }
.sheet h3 { font-size: 19px; margin-bottom: 8px; }
.sheet p { margin: 0 0 14px; color: var(--sub); font-size: 15px; line-height: 1.6; }
.sheet .form { margin-bottom: 8px; }
.sheet .row-btn { margin-top: 14px; }
.sheet .row-btn .btn { flex: 1; }
#busy { position: fixed; inset: 0; background: rgba(255,255,255,.7); z-index: 120; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; font-weight: 700; }
.spin { width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--line); border-top-color: var(--blue); animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
#toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 90px); background: var(--ink); color: #fff; padding: 14px 22px; border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; transition: .26s; z-index: 130; max-width: 88vw; text-align: center; }
#toast.show { transform: translate(-50%, 0); opacity: 1; }
#toast.bad { background: var(--red); }

@media (max-width: 760px) {
  .wrap { flex-direction: column; }
  .tabs { flex-direction: row; margin: 0 0 -22px 12px; padding-top: 0; overflow-x: auto; max-width: calc(100% - 12px); padding-bottom: 14px; }
  .tab { width: auto; min-width: 110px; flex: 0 0 auto; height: 52px; border-radius: 12px 12px 4px 4px; }
  .tab::after { display: none; }
  .tab:hover { transform: translateY(-4px) rotate(0deg); }
  .tab.on { transform: translateY(-6px) rotate(0deg); }
  .folder { width: 100%; border-radius: 22px; flex: 0 0 auto; }
  .folder::before { display: none; }
  .stack { margin-left: 0; min-height: 0; }
  .leaf { padding: 40px 20px 32px; border-radius: 22px; }
  .big { font-size: 36px; }
  h1 { font-size: 24px; }
  .tpanel { padding: 18px; }
}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="login" class="login" hidden>
  <span class="logo" aria-hidden="true">돼</span>
  <h1 id="lname">돼지공주나라</h1>
  <p>우리 반 행복 나라에 오신 걸 환영해요</p>
  <form class="lbox" id="lform" autocomplete="off">
    <input id="lnum" type="text" inputmode="numeric" placeholder="내 번호" aria-label="내 번호">
    <input id="lpin" type="password" inputmode="numeric" maxlength="4" placeholder="비밀번호 (숫자 4자리)" aria-label="비밀번호">
    <button class="btn" type="submit" id="lgo">들어가기</button>
    <p class="err" id="lerr"></p>
    <button class="linkbtn" type="button" id="lswitch">선생님으로 들어가기</button>
    <div id="gwrap" class="gwrap" hidden>
      <div id="gbtn"></div>
    </div>
  </form>
</div>

<!-- 앱 -->
<div id="app" class="stage" hidden>
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">돼</span><span id="brandName">돼지공주나라</span></div>
    <div class="top-r">
      <select id="asSel" class="asel" aria-label="미리 볼 학생" hidden></select>
      <span class="chip gray" id="whoChip"></span>
      <button class="ghost" type="button" id="logout">나가기</button>
    </div>
  </header>
  <div class="wrap">
    <nav class="tabs" id="tabs" aria-label="메뉴"></nav>
    <main class="folder">
      <div class="stack" id="stack"></div>
    </main>
  </div>
</div>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="busy" hidden><div class="spin"></div><span id="busyText">처리 중이에요</span></div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ====================================================================
   도우미
==================================================================== */
const $ = (s, r) => (r || document).querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString('ko-KR');
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const val = (id) => { const e = document.getElementById(id); return e ? e.value : ''; };

const TABS = [
  { id: 'info', label: '기본정보', bg: '#FFE99A' },
  { id: 'bank', label: '은행', bg: '#C9E4FF' },
  { id: 'shop', label: '상점', bg: '#FFC9D4' },
  { id: 'jobs', label: '직업소', bg: '#C8F1D4' },
  { id: 'work', label: '직업 활동', bg: '#E3D0FF' },
  { id: 'board', label: '우리반 보드', bg: '#FFD9B8' },
  { id: 'etc', label: '기타', bg: '#FFFFFF', teacher: true },
];
const tabsNow = () => TABS.filter((t) => !t.teacher || isTeacher());

const st = {
  token: null, role: null, perms: [], myId: '', myName: '', asId: '',
  tab: 'info', info: null, history: null, shop: null, shopTab: '세금', groups: null, bank: null, jobs: null,
  board: null, boardId: '', posts: null, tm: { info: false, shop: false, bank: false, jobs: false, board: false }, sub: { info: 'approvals', shop: 'items', etc: 'jobs' }, w: {},
  adm: { students: null, shop: null, groups: null, treasury: null, settings: null, bank: null, assign: null, approvals: null, jobs: null },
  sel: new Set(), forms: {},
};
const isTeacher = () => st.role === 'teacher';
const can = (p) => isTeacher() || st.perms.includes(p);
const cur = () => (st.info ? st.info.currency : '행복');

// 학생은 이 기기에 로그인 상태를 남겨서(60일) 다음에 열면 바로 들어와요. 선생님은 창을 닫으면 풀려요.
function tokenRole(t) { try { return JSON.parse(atob(t.split('.')[0].replace(/-/g, '+').replace(/_/g, '/'))).role; } catch (e) { return ''; } }
function saveToken() {
  try {
    sessionStorage.removeItem('pigtoken'); localStorage.removeItem('pigtoken');
    if (st.token) (tokenRole(st.token) === 'student' ? localStorage : sessionStorage).setItem('pigtoken', st.token);
  } catch (e) {}
}
function loadToken() { try { return sessionStorage.getItem('pigtoken') || localStorage.getItem('pigtoken'); } catch (e) { return null; } }

let toastTimer;
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = ''), 2600);
}
function busy(on, text) { $('#busy').hidden = !on; if (text) $('#busyText').textContent = text; }

async function api(path, opt) {
  opt = opt || {};
  const r = await fetch(path, {
    method: opt.method || 'GET',
    headers: { 'Content-Type': 'application/json', ...(st.token ? { Authorization: 'Bearer ' + st.token } : {}) },
    body: opt.body ? JSON.stringify(opt.body) : undefined,
  });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && st.token) { logout(); throw new Error('다시 로그인해 주세요'); }
  if (!r.ok) throw new Error(j.error || '서버에 문제가 생겼어요. 잠시 뒤 다시 해 주세요');
  return j;
}
// 처리 중 표시 + 오류 알림을 한꺼번에
async function run(text, fn) {
  busy(true, text);
  try { return await fn(); }
  catch (e) { toast(e.message || '연결이 불안정해요', true); return null; }
  finally { busy(false); }
}
const asQ = () => (isTeacher() ? '?as=' + encodeURIComponent(st.asId) : '');

/* ---------- 창(모달) ---------- */
function openModal(html, wide) {
  $('#sheet').className = 'sheet' + (wide ? ' wide' : '');
  $('#sheet').innerHTML = html;
  $('#modal').hidden = false;
  const f = $('#sheet input, #sheet select, #sheet textarea'); if (f) setTimeout(() => f.focus(), 50);
}
function closeModal() { st.openPost = ''; $('#modal').hidden = true; $('#sheet').innerHTML = ''; }
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); e.stopImmediatePropagation(); } });

/* ====================================================================
   로그인 / 시작
==================================================================== */
let teacherLogin = false;
$('#lswitch').onclick = () => {
  teacherLogin = !teacherLogin;
  $('#lnum').hidden = teacherLogin;
  $('#lpin').placeholder = teacherLogin ? '선생님 비밀번호' : '비밀번호 (숫자 4자리)';
  $('#lpin').maxLength = teacherLogin ? 40 : 4;
  $('#lpin').value = '';
  $('#lpin').type = 'password';
  $('#lpin').inputMode = teacherLogin ? 'text' : 'numeric';
  $('#lswitch').textContent = teacherLogin ? '학생으로 들어가기' : '선생님으로 들어가기';
  $('#lerr').textContent = '';
  if (teacherLogin) initGoogle(false); else $('#gwrap').hidden = true; // 구글 로그인은 선생님 로그인에서만 보여요
};
$('#lform').onsubmit = async (e) => {
  e.preventDefault();
  $('#lerr').textContent = ''; $('#lgo').disabled = true;
  try {
    const body = teacherLogin ? { role: 'teacher', pin: val('lpin') } : { role: 'student', id: val('lnum').trim(), pin: val('lpin') };
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || '서버에 문제가 생겼어요');
    st.token = j.token; saveToken();
    await enter();
  } catch (err) { $('#lerr').textContent = err.message; }
  finally { $('#lgo').disabled = false; }
};
/* ---------- 구글 계정으로 선생님 자동 로그인 ---------- */
// 서버에 구글 클라이언트 ID가 설정돼 있을 때만 보여요. 선생님 계정 목록은 서버가 확인해요.
let googleReady = false, googleLoading = false;
async function googleCredential(resp) {
  if (!resp || !resp.credential) return;
  $('#lerr').textContent = '';
  try {
    const r = await fetch('/api/login/google', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || '서버에 문제가 생겼어요');
    st.token = j.token; saveToken();
    try { localStorage.setItem('pigteacherdev', '1'); } catch (e) {} // 선생님이 구글로 들어온 기기는 다음부터 자동 로그인 안내가 떠요
    await enter();
  } catch (err) { $('#lerr').textContent = err.message; }
}
const isTeacherDevice = () => { try { return localStorage.getItem('pigteacherdev') === '1'; } catch (e) { return false; } };
let googleClientId = '';
// auto가 true면 이 기기에서 구글에 이미 로그인돼 있을 때 바로 들어가요. 나가기 뒤에는 false로 불러서 자동으로 다시 들어가지 않게 해요.
function initGoogle(auto) {
  if (!googleClientId) return;
  if (googleReady) { if (teacherLogin) showGoogleButton(); return; }
  if (googleLoading) return;
  googleLoading = true;
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;
  s.onload = () => {
    if (!window.google || !google.accounts || !google.accounts.id) return;
    googleReady = true;
    google.accounts.id.initialize({ client_id: googleClientId, callback: googleCredential, auto_select: !!auto, cancel_on_tap_outside: false });
    if (teacherLogin) showGoogleButton();
    if (auto && !$('#login').hidden) google.accounts.id.prompt();
  };
  document.head.appendChild(s);
}
function showGoogleButton() {
  if (!googleReady) return;
  $('#gbtn').innerHTML = '';
  google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'ko' });
  $('#gwrap').hidden = false;
}
const TEACHER_GREETING = '선생님, 안녕하세요<br>오늘도 행복하세요';

function logout() {
  // 나가기를 눌렀는데 곧바로 다시 자동 로그인되지 않게 해요
  try { if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect(); } catch (e) {}
  st.token = null; saveToken(); st.role = null; st.info = null; st.shop = null; st.groups = null; st.history = null; st.bank = null; st.jobs = null;
  st.adm = { students: null, shop: null, groups: null, treasury: null, settings: null, bank: null, assign: null, approvals: null, jobs: null }; st.w = {};
  st.tm = { info: false, shop: false, bank: false, jobs: false, board: false }; st.tab = 'info'; st.board = null; st.boardId = ''; st.posts = null; renderBoardFull();
  closeModal(); $('#app').hidden = true; $('#login').hidden = false; $('#lpin').value = '';
}
$('#logout').onclick = logout;

async function enter() {
  const w = await api('/api/whoami');
  st.role = w.role; st.perms = w.perms || []; st.myId = w.id || ''; st.myName = w.name || '';
  if (isTeacher()) {
    const a = await api('/api/admin/students');
    st.adm.students = a;
    // 선생님은 학생 미리보기 없이 시작하고, 기본정보 교사 모드가 자동으로 켜져요
    st.asId = '';
    st.tm.info = true;
    st.sub.info = a.students.length ? 'approvals' : 'register';
    if (a.students.length) loadApprovals(false).then(() => renderInfo());
  }
  $('#login').hidden = true; $('#app').hidden = false;
  buildFrame();
  $('#whoChip').textContent = isTeacher() ? '선생님 · 학생 화면 미리보기' : st.myName + '님';
  fillAsSel();
  goTab('info', true);
  loadInfo();
}
function fillAsSel() {
  const sel = $('#asSel');
  sel.hidden = !isTeacher();
  if (!isTeacher()) return;
  const ss = (st.adm.students || {}).students || [];
  sel.innerHTML = ss.length
    ? `<option value=""${st.asId ? '' : ' selected'}>학생 미리보기 안 함</option>` + ss.map((s) => `<option value="${esc(s.id)}"${s.id === st.asId ? ' selected' : ''}>${esc(s.id)}번 ${esc(s.name)}</option>`).join('')
    : '<option value="">학생 없음</option>';
}
$('#asSel').onchange = (e) => {
  st.asId = e.target.value; st.info = null; st.history = null; st.shop = null; st.groups = null; st.bank = null; st.jobs = null; st.w = {};
  renderAll(); loadInfo();
  if (!st.asId) return;
  if (st.tab === 'shop') loadShop(); if (st.tab === 'bank') loadBank(); if (st.tab === 'jobs') loadJobs(); if (st.tab === 'work') loadWork();
};

/* ====================================================================
   틀 (탭 + 종이)
==================================================================== */
function buildFrame() {
  $('#tabs').innerHTML = tabsNow().map((t) => `<button type="button" class="tab" data-act="tab" data-id="${t.id}" style="background-color:${t.bg}">${t.label}</button>`).join('');
  $('#stack').innerHTML = tabsNow().map((t) => `<section class="leaf" id="lf-${t.id}" aria-label="${t.label}"></section>`).join('');
  renderAll();
}
function goTab(id, first) {
  st.tab = id;
  const idx = tabsNow().findIndex((t) => t.id === id);
  document.querySelectorAll('.tab').forEach((b, i) => {
    b.classList.toggle('on', i === idx);
    b.setAttribute('aria-current', i === idx ? 'page' : 'false');
  });
  tabsNow().forEach((t, i) => {
    const lf = $('#lf-' + t.id);
    const keepTm = lf.classList.contains('tmon');
    lf.className = 'leaf ' + (i < idx ? 'gone' : i === idx ? 'cur' : '') + (keepTm ? ' tmon' : '') + (i === idx ? '' : (lf.dataset.out === '1' ? ' out' : ''));
    lf.style.zIndex = String(100 - i);
    if (i === idx) lf.dataset.out = '0';
  });
  clearTimeout(st.outT);
  st.outT = setTimeout(() => { tabsNow().forEach((t, i) => { const l = $('#lf-' + t.id); if (i !== idx) { l.dataset.out = '1'; l.classList.add('out'); } }); }, 1000);
  if (!first) {
    if (id === 'shop' && !st.shop) loadShop();
    if (id === 'shop' && !st.groups && st.shopTab === '공동구매') loadGroups();
    if (id === 'info' && !st.info) loadInfo();
    if (id === 'bank' && !st.bank) loadBank();
    if (id === 'jobs' && !st.jobs) loadJobs();
    if (id === 'board' && !st.board) loadBoards();
    if (id === 'work' && !st.w.info) loadWork();
    if (window.innerWidth <= 760) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}
function renderAll() { renderInfo(); renderBank(); renderShop(); renderJobs(); renderBoard(); renderWork(); renderEtc(); }
function renderEtc() {
  const el = $('#lf-etc'); if (!el || !isTeacher()) return;
  el.innerHTML = leafHead('기타', '선생님 도구', 'etc', false) + `<section class="etcbox">${etcPanel()}</section>`;
}

function leafHead(eyebrow, titleHtml, tmKey, tmAllowed) {
  const on = st.tm[tmKey];
  return `<div class="head"><div><p class="eyebrow">${eyebrow}</p><h1>${titleHtml}</h1></div>` +
    (tmAllowed ? `<button type="button" class="tm ${on ? 'on' : ''}" data-act="tm" data-id="${tmKey}" aria-pressed="${on}">${on ? '교사 모드 닫기' : '교사 모드'}${tmKey === 'info' && isTeacher() && pendingCount() ? ` <span class="badge warn">승인 ${pendingCount()}</span>` : ''}</button>` : '') + '</div>';
}

/* ====================================================================
   1. 기본정보
==================================================================== */
async function loadInfo() {
  if (isTeacher() && !st.asId) { renderInfo(); return; }
  try {
    const [info, hist] = await Promise.all([api('/api/info' + asQ()), api('/api/history' + asQ() + (asQ() ? '&' : '?') + 'limit=30')]);
    st.info = info; st.history = hist;
  } catch (e) { toast(e.message, true); }
  renderInfo(); loadAsgMine();
}
function renderInfo() {
  const el = $('#lf-info'); if (!el) return;
  const i = st.info;
  let body;
  if (!i) {
    const hasStudents = !!((st.adm.students || {}).students || []).length;
    body = leafHead('기본정보', isTeacher() ? TEACHER_GREETING : '불러오는 중이에요', 'info', isTeacher()) +
      (isTeacher() && !st.asId
        ? (hasStudents ? '<div class="empty">위쪽 선택 칸에서 학생을 고르면 그 학생이 보는 화면을 미리 볼 수 있어요.</div>'

function historyHtml(list) {
  if (!list.length) return '<p class="note">아직 거래가 없어요.</p>';
  return list.map((h) => `<div class="item"><div class="ic ${h.amount >= 0 ? 'in' : 'out'}" aria-hidden="true">${h.amount >= 0 ? '+' : '−'}</div>` +
    `<div class="t"><b>${esc(h.reason)}</b><span>${esc(h.at)} · ${esc(h.kind)}</span></div>` +
    `<div class="amt ${h.amount >= 0 ? 'p' : 'm'}">${h.amount >= 0 ? '+' : ''}${fmt(h.amount)}</div></div>`).join('');
}

const shopTeacherAllowed = () => can('상점관리') || can('국고관리') || isTeacher();

function renderShop() {
  const el = $('#lf-shop'); if (!el) return;
  let body = leafHead('상점', '필요한 건 골라서<br>똑똑하게 사요', 'shop', shopTeacherAllowed());
  body += `<div class="segs">` + ['세금', '간식', '쿠폰', '공동구매'].map((c) => `<button type="button" class="seg ${st.shopTab === c ? 'on' : ''}" data-act="shopTab" data-id="${c}">${c}</button>`).join('') + `</div>`;
  const s = st.shop;
  if (isTeacher() && !st.asId) body += '<div class="empty">미리 볼 학생이 없어요. 학생을 먼저 등록해 주세요.</div>';
  else if (!s) body += '<div class="empty">불러오는 중이에요…</div>';
  else {
    const c = s.currency;
    body += `<div class="stats" style="max-width:640px"><div class="stat" style="background:#F9FAFB"><small>${s.balance < 0 ? '갚아야 할 빚' : '내 ' + esc(c)}</small><b style="${s.balance < 0 ? 'color:var(--red)' : ''}">${fmt(Math.abs(s.balance))}</b></div>` +
      `<div class="stat" style="background:#F9FAFB"><small>이번 세금 주기</small><b style="font-size:16px">${esc(s.cycleRange)}</b></div>` +
      `<div class="stat" style="background:#F9FAFB"><small>이번 달 월세</small><b>${s.rentExempt ? '면제' : fmt((s.items.find((x) => x.isRent) || {}).price || 0)}</b></div></div>`;
    body += `<p class="note">세금은 매달 한 번씩 꼭 내야 해요.${s.balance < 0 && s.debtBlocks ? ' 빚이 있으면 간식·쿠폰은 살 수 없어요.' : ''}</p>`;
    if (st.shopTab === '공동구매') body += groupsHtml();
    else body += itemsHtml(s);
  }
  if (st.tm.shop && shopTeacherAllowed()) body += shopTeacherPanel();
  el.innerHTML = body; applyTm(el, 'shop');
}
function itemsHtml(s) {
  const list = s.items.filter((i) => i.category === st.shopTab);
  if (!list.length) return `<div class="empty">${st.shopTab === '세금' && s.rentExempt ? '자리를 샀기 때문에 월세가 면제됐어요. 남은 세금만 내면 됩니다.' : '이 칸에는 아직 물건이 없어요.'}</div>`;
  return `<div class="grid">` + list.map((i) => {
    let badge, bc = '';
    if (i.category === '세금') { badge = i.paid ? '✅ 이번 달 납부 완료' : `아직 안 냈어요 · 반 전체 ${i.paidCount}/${i.studentCount}명`; bc = i.paid ? 'green' : 'warn'; }
    else if (i.remaining === null) { badge = '수량 제한 없음'; bc = 'gray'; }
    else { badge = `남은 수량 ${i.remaining}개`; bc = i.remaining <= 3 ? 'warn' : 'green'; }
    const lim = i.limit !== null && i.category !== '세금' ? `하루 1인 ${i.limit}개 (오늘 내가 ${i.myToday}개)` : '';
    const label = { '품절': '품절', '한도 도달': '오늘은 다 샀어요', '납부 완료': '납부 완료', '행복 부족': cur() + '이 부족해요', '빚 먼저': '빚을 먼저 갚아요' }[i.blocked] || (i.category === '세금' ? '납부하기' : '구매하기');
    return `<div class="card"><span class="badge ${bc}">${esc(badge)}</span><div class="nm">${esc(i.name)}</div><div class="ds">${esc(i.desc)}</div>` +
      (lim ? `<div class="st">${lim}</div>` : '') + `<div class="pr">${fmt(i.price)} ${esc(s.currency)}</div>` +
      `<button type="button" class="btn small ${i.blocked ? '' : 'sec'}" ${i.blocked ? 'disabled' : ''} data-act="buy" data-id="${esc(i.id)}">${label}</button></div>`;
  }).join('') + `</div>`;
}
function groupsHtml() {
  const g = st.groups;
  if (!g) { loadGroups(); return '<div class="empty">불러오는 중이에요…</div>'; }

    return `<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><div class="nm">${esc(x.title)}</div>${badge}</div>` +
      (x.desc ? `<div class="ds" style="min-height:0">${esc(x.desc)}</div>` : '') +
      `<div class="bar"><i style="width:${pct}%"></i></div><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--sub)"><span>${fmt(x.raised)} / ${fmt(x.target)} ${esc(g.currency)}</span><span>${pct}%</span></div>` +
      (x.status === '진행중' ? `<div class="st">최소 ${fmt(x.min)}부터 참여할 수 있어요</div><button type="button" class="btn small sec" data-act="gJoin" data-id="${esc(x.id)}">참여하기</button>` : '') +
      (x.mine.length ? `<div style="border-top:1px solid var(--line);margin-top:8px;padding-top:6px"><div class="st">내가 낸 돈 (합계 ${fmt(x.mineSum)})</div>` +
        x.mine.map((m) => `<div class="mrow" style="border:0;padding:4px 0"><div class="t"><b>${fmt(m.amount)}</b><i>${esc(m.at)}</i></div>${x.status === '진행중' ? `<button type="button" class="btn tiny gray" data-act="gCancel" data-id="${esc(m.id)}">취소</button>` : ''}</div>`).join('') + '</div>' : '') + `</div>`;
  }).join('');
}

async function impSend(run) {
  const f = document.getElementById('impFile') && document.getElementById('impFile').files[0];
  if (!f && !(st.forms.imp && st.forms.imp.data)) return toast('파일을 먼저 골라 주세요', true);
  if (f) { try { st.forms.imp = { data: JSON.parse(await f.text()) }; } catch (e) { return toast('내보내기 파일을 읽을 수 없어요', true); } }
  const r = await run_('처리하는 중이에요', () => api('/api/admin/import', { method: 'POST', body: { data: st.forms.imp.data, run } }));
  if (!r) return;
  st.forms.imp.result = r;
  if (run) { toast(r.message); st.adm = { students: null, shop: null, groups: null, treasury: null, settings: null, bank: null, assign: null }; st.info = st.shop = st.bank = st.jobs = st.groups = st.board = null; await loadAdmStudents(false); fillAsSel(); }

}

function shopTabsAllowed() {
  const l = [];
  if (can('상점관리')) l.push(['items', '상품 관리']);
  if (isTeacher()) l.push(['groups', '공동구매 관리']);
  if (can('국고관리')) l.push(['treasury', '국고']);
  return l;
}
function shopTeacherPanel() {
  const tabs = shopTabsAllowed();
  if (!tabs.length) return '';
  if (!tabs.some(([id]) => id === st.sub.shop)) st.sub.shop = tabs[0][0];
  const sub = st.sub.shop;

}

  st.shop = null; st.groups = null; st.bank = null; st.jobs = null; st.adm.assign = null; st.adm.groups = null; st.adm.shop = null; st.adm.treasury = null; st.adm.bank = null;

function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      let q = 0.8, d = c.toDataURL('image/jpeg', q);
      while (d.length > 480000 && q > 0.4) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url);
      if (d.length > 690000) reject(new Error('사진이 너무 커요')); else resolve(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('사진을 읽을 수 없어요')); };
    img.src = url;
  });
}

const DOC_MAX = 700000, DOC_EXTS = ['md', 'pdf', 'txt'];
function readDoc(file) {
  return new Promise((resolve, reject) => {
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (!DOC_EXTS.includes(ext)) return reject(new Error(`"${file.name}"은(는) 올릴 수 없어요 (md, pdf, txt만 돼요)`));
    if (file.size > DOC_MAX) return reject(new Error(`"${file.name}"이(가) 너무 커요 (${Math.floor(DOC_MAX / 1000)}KB까지)`));
    const r = new FileReader();
    r.onload = () => resolve({ name: file.name, size: file.size, data: String(r.result).split(',')[1] || '' });
    r.onerror = () => reject(new Error(`"${file.name}"을(를) 읽을 수 없어요`));
    r.readAsDataURL(file);
  });
}

  seatCollect: async (d) => { const r = await run('신청하는 중이에요', () => api(`/api/work/seats/${d.id}/collect`, { method: 'POST', body: {} })); if (r) { closeModal(); toast(r.message); loadSeats(); loadApprovals(false); } },
  seatDel: async (d) => { const r = await run('처리하는 중이에요', () => api(`/api/work/seats/${d.id}/delete`, { method: 'POST', body: {} })); if (r) { closeModal(); toast(r.message); loadSeats(); } },
  seatRelease: async (d) => { const r = await run('풀고 있어요', () => api(`/api/admin/seats/${d.id}/release`, { method: 'POST', body: { refund: d.refund === '1' } })); if (r) { closeModal(); toast(r.message); st.info = null; loadSeats(); afterMoney(); } },
  /* 국세청 */
  tqGo: async () => { const r = await run('신청하는 중이에요', () => api('/api/work/treasury/request', { method: 'POST', body: { kind: val('tqKind'), amount: val('tqAmt'), studentId: val('tqWho'), reason: val('tqWhy') } })); if (r) { toast(r.message); st.adm.treasury = null; loadTreasury(); } },
  /* 과제 */
  asgDone: async (d) => { const r = await run('저장하는 중이에요', () => api(`/api/assignments/${encodeURIComponent(d.id)}/done`, { method: 'POST', body: { on: d.on === '1' } })); if (r) { toast(r.message); loadAsgMine(); } },
  asgPen: async (d) => { const r = await run('바꾸는 중이에요', () => api(`/api/admin/assignments/${encodeURIComponent(st.w.asgBoardId)}/penalty`, { method: 'POST', body: { on: d.on === '1' } })); if (r) { toast(r.message); loadAsgBoard(st.w.asgBoardId); } },
  asgOpen: (d) => { st.w.asgBoardId = d.id; st.w.asgBoard = null; loadAsgBoard(d.id); },
  asgBack: () => { st.w.asgBoardId = ''; st.w.asgBoard = null; st.w.asgList = null; asgRender(); },
  asgReload: () => { st.w.asgList = null; asgRender(); },
  asgBoardReload: () => loadAsgBoard(st.w.asgBoardId),
  asgNew: async () => { const r = await run('내는 중이에요', () => api('/api/admin/assignments', { method: 'POST', body: { title: val('asgTitle'), desc: val('asgDesc'), penalty: !!(document.getElementById('asgPen') && document.getElementById('asgPen').checked) } })); if (r) { toast(r.message); st.w.asgList = null; asgRender(); } },
  asgMark: async (d) => {
    const v = st.w.asgBoard, cur_ = v.status[d.id] || '', next = cur_ === d.s ? '' : d.s;
    if (next) v.status[d.id] = next; else delete v.status[d.id];
    st.w.asgBusy = (st.w.asgBusy || 0) + 1; asgRender();
    try { const r = await api(`/api/work/assignments/${encodeURIComponent(st.w.asgBoardId)}/check`, { method: 'POST', body: { studentId: d.id, status: next } }); if (st.w.asgBusy === 1) st.w.asgBoard = r; }
    catch (e) { toast(e.message, true); loadAsgBoard(st.w.asgBoardId); }
    st.w.asgBusy--; asgRender();
  },
  asgAll: async (d) => { const r = await run('처리하는 중이에요', () => api(`/api/work/assignments/${encodeURIComponent(st.w.asgBoardId)}/all`, { method: 'POST', body: { status: d.s } })); if (r) { st.w.asgBoard = r; asgRender(); } },
  asgFill: async () => { const r = await run('채우는 중이에요', () => api(`/api/work/assignments/${encodeURIComponent(st.w.asgBoardId)}/fill-done`, { method: 'POST', body: {} })); if (r) { st.w.asgBoard = r; asgRender(); } },
  asgSend: () => openModal(`<h3>선생님께 보낼까요?</h3><p>보내면 친구들 화면에서 이 과제가 사라지고, 더 고칠 수 없어요.</p><div class="row-btn"><button class="btn gray" data-act="close">그만두기</button><button class="btn" data-act="asgSendGo">보내기</button></div>`),
  asgSendGo: async () => { const r = await run('보내는 중이에요', () => api(`/api/work/assignments/${encodeURIComponent(st.w.asgBoardId)}/send`, { method: 'POST', body: {} })); if (r) { closeModal(); toast(r.message); ACT.asgBack(); } },
  asgSaveAsk: () => openModal(`<h3>최종 저장하고 마감할까요?</h3><p>체크한 결과가 신용점수에 반영돼요.${st.w.asgBoard && st.w.asgBoard.assignment.penalty ? ' 이 과제는 <b>미제출이면 신용점수가 깎여요</b>.' : ''} 체크하지 않은 친구는 <b>제출</b>로 처리돼요. 마감한 뒤에는 고칠 수 없어요.</p><div class="row-btn"><button class="btn gray" data-act="close">그만두기</button><button class="btn" data-act="asgSaveGo">저장하고 마감</button></div>`),
  asgSaveGo: async () => { const r = await run('저장하는 중이에요', () => api(`/api/admin/assignments/${encodeURIComponent(st.w.asgBoardId)}/save`, { method: 'POST', body: {} })); if (r) { closeModal(); toast(r.message); st.info = null; st.adm.students = null; ACT.asgBack(); loadInfo(); } },
  asgReturn: async () => { const r = await run('돌려보내는 중이에요', () => api(`/api/admin/assignments/${encodeURIComponent(st.w.asgBoardId)}/return`, { method: 'POST', body: {} })); if (r) { toast(r.message); ACT.asgBack(); } },
  asgDel: () => openModal(`<h3>이 과제를 지울까요?</h3><p>과제가 사라져요. 이미 신용점수에 반영된 기록은 그대로예요.</p><div class="row-btn"><button class="btn gray" data-act="close">그만두기</button><button class="btn red" data-act="asgDelGo">지우기</button></div>`),
  asgDelGo: async () => { const r = await run('지우는 중이에요', () => api(`/api/admin/assignments/${encodeURIComponent(st.w.asgBoardId)}/delete`, { method: 'POST', body: {} })); if (r) { closeModal(); toast(r.message); ACT.asgBack(); } },
  /* 제출 */
  subSet: async (d) => {
    const cur_ = st.w.submit.status[d.id] || '', next = cur_ === d.s ? '' : d.s;
    if (next) st.w.submit.status[d.id] = next; else delete st.w.submit.status[d.id];
    const it = document.getElementById('subItem'); const item = it ? it.value : st.w.submit.item; st.w.submit.item = item;
    st.w.subBusy = (st.w.subBusy || 0) + 1;
    if (st.tab === 'work') renderWork(); renderInfo();
    try { const r = await api('/api/work/submit/check', { method: 'POST', body: { studentId: d.id, status: next, item } }); if (st.w.subBusy === 1) st.w.submit = r; }
    catch (e) { toast(e.message, true); st.w.submit = null; }
    st.w.subBusy--;
    if (st.tab === 'work') renderWork(); renderInfo();
  },
  subAll: async (d) => { const r = await run('처리하는 중이에요', () => api('/api/work/submit/all', { method: 'POST', body: { status: d.id } })); if (r) { st.w.submit = r; if (st.tab === 'work') renderWork(); renderInfo(); } },
  subReload: () => { st.w.submit = null; if (st.tab === 'work') renderWork(); renderInfo(); },
  subSave: async () => {
    const r = await run('저장하는 중이에요', () => api('/api/admin/submit/save', { method: 'POST', body: { item: val('subItem') } }));
    if (r) { toast(r.message); st.w.submit = null; st.info = null; st.adm.students = null; loadAdmStudents(); loadInfo(); }
  },
  /* 신용 */
  cutPrev: async () => { const r = await run('계산하는 중이에요', () => api('/api/work/credit/preview', { method: 'POST', body: { cuts: val('cuts') } })); if (r) { st.w.creditPrev = { ...r, cuts: val('cuts') }; renderWork(); } },
  cutSave: async () => { const r = await run('저장하는 중이에요', () => api('/api/work/credit/save', { method: 'POST', body: { cuts: val('cuts') } })); if (r) { toast(r.message); st.w.creditPrev = null; st.w.credit = null; st.info = null; loadCredit(); } },
  /* 은행 상품 */
  prodEdit: (d) => {
    const r = (st.adm.bank.rates || []).find((x) => String(x.days) === String(d.days)) || { name: '', days: '', rates: [0, 0, 0, 0, 0] };
    openModal(`<h3>${r.name ? '예금 상품 고치기' : '새 예금 상품'}</h3><p>이름에 기간을 적어 주세요. (1주 · 2주 · 1달 …) 기간은 이름에서 알아서 읽어요.</p><div class="form"><div class="field"><label for="pdName">상품 이름</label><input id="pdName" value="${esc(r.name)}" placeholder="1주"></div></div>
      <div class="form">${r.rates.map((v, i) => `<div class="field" style="flex-basis:70px"><label for="pdR${i}">${i + 1}등급 %</label><input id="pdR${i}" type="number" value="${v}"></div>`).join('')}</div>
      <div class="row-btn"><button class="btn gray" data-act="close">그만두기</button><button class="btn" data-act="prodSave">저장</button></div>`, true);
  },
  prodSave: async () => {
    const r = await run('저장하는 중이에요', () => api('/api/admin/bank/product', { method: 'POST', body: { name: val('pdName'), rates: [0, 1, 2, 3, 4].map((i) => val('pdR' + i)) } }));
    if (r) { closeModal(); toast(r.message); st.bank = null; loadAdmBank(); }
  },
  prodDel: (d) => openModal(`<h3>이 상품을 없앨까요?</h3><p>이미 맡긴 예금은 그대로 유지돼요.</p><div class="row-btn"><button class="btn gray" data-act="close">그만두기</button><button class="btn red" data-act="prodDelGo" data-days="${d.days}">없애기</button></div>`),
  prodDelGo: async (d) => { const r = await run('처리하는 중이에요', () => api(`/api/admin/bank/product/${d.days}/delete`, { method: 'POST', body: {} })); if (r) { closeModal(); toast(r.message); st.bank = null; loadAdmBank(); } },
  /* 보드 전체 삭제 */
  boardWipe: () => openModal(`<h3>보드를 모두 지울까요?</h3><p>모든 보드와 글·사진·댓글·추천이 사라지고 되돌릴 수 없어요. 확인하려면 <b>삭제</b>라고 적어 주세요.</p><div class="field"><input id="wipeWord" placeholder="삭제"></div><div class="row-btn"><button class="btn gray" data-act="close">그만두기</button><button class="btn red" data-act="boardWipeGo">모두 지우기</button></div>`),
  boardWipeGo: async () => { const r = await run('지우는 중이에요', () => api('/api/admin/boards/wipe-all', { method: 'POST', body: { confirm: val('wipeWord') } })); if (r) { closeModal(); toast(r.message); st.boardId = ''; st.posts = null; loadBoards(); } },
};
Object.assign(ACT, WORK_ACT);

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act];
  if (fn) fn(b.dataset, b, e);
});
// 학생 관리 표: 직업·수학은 바꾸면 바로 저장
document.addEventListener('change', async (e) => {
  const f = e.target.dataset && e.target.dataset.f;
  if (f !== 'job' && f !== 'math') return;
  const tr = e.target.closest('tr[data-sid]'); if (!tr) return;
  const id = tr.dataset.sid;
  const r = f === 'job'
    ? await run('저장하는 중이에요', () => api(`/api/admin/students/${id}/job`, { method: 'POST', body: { jobId: e.target.value } }))
    : await run('저장하는 중이에요', () => api(`/api/admin/students/${id}/math`, { method: 'POST', body: { score: e.target.value } }));
  if (r) toast(r.message); 
  await loadAdmStudents();
  if (String(st.asId) === id) { st.info = null; loadInfo(); }
});

/* ====================================================================
   시작
==================================================================== */
(async function boot() {
  try { const c = await fetch('/api/country').then((r) => r.json()); googleClientId = c.googleClientId || ''; if (c.name) { document.title = c.name; $('#lname').textContent = c.name; $('#brandName').textContent = c.name; } } catch (e) {}
  const t = loadToken();
  if (t) { st.token = t; try { await enter(); return; } catch (e) { st.token = null; saveToken(); } }
  $('#login').hidden = false;
  if (isTeacherDevice()) initGoogle(true); // 선생님 기기만 구글 자동 로그인 안내가 떠요. 학생 기기는 구글 코드를 불러오지도 않아요
})();
</script>
